name: basic-express-dev
services:
  dev-api:
    build:
      context: .
      target: development
    command: npm run dev
    env_file: .env.development.example
    environment:
      PERSISTENCE_PROVIDER: postgres
      REDIS_ENABLED: true
      POSTGRES_HOST: dev-postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: dev-redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000'
    volumes:
      - ./src:/usr/src/app/src
    depends_on:
      dev-postgres:
        condition: service_healthy
      dev-redis:
        condition: service_healthy

  dev-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: express_dev
      POSTGRES_PASSWORD: express_dev
      POSTGRES_DB: express_dev
    ports:
      - '5433:5432'
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U express_dev -d express_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  dev-redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - dev-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev-postgres-data:
  dev-redis-data:
